name: lang
on:
  push:
    branches: [preview, main]
    paths: ['src/**', 'tools/lang/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 翻译检查（缺词就失败）
        run: node tools/check_lang.mjs
