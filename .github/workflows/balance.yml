name: balance
on:
  workflow_dispatch:
    inputs:
      n: { description: '每个角色每档局数', default: '1000' }
      lock: { description: '解锁档 0-4', default: '4' }
  push:
    branches: [preview]
    paths: ['src/data.js', 'tools/sim.mjs']
concurrency: { group: balance-report, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ch: [miko, hero, witch, heroine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/sim.mjs ${{ inputs.n || '1000' }} ${{ inputs.lock || '4' }} ${{ matrix.ch }} | tee -a $GITHUB_STEP_SUMMARY
      - run: mv data/balance.md data/balance_${{ matrix.ch }}.md
      - uses: actions/upload-artifact@v4
        with: { name: 'bal-${{ matrix.ch }}', path: 'data/balance_${{ matrix.ch }}.md' }
  report:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - name: 合并并提交回 preview
        run: |
          cat parts/balance_*.md > data/balance.md; cat data/balance.md >> $GITHUB_STEP_SUMMARY
          git config user.name "balance-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/balance.md; git commit -m "平衡测试结果 [skip ci]" || exit 0
          git pull --rebase origin preview && git push origin HEAD:preview
